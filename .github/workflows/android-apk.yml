name: Android APK

on:
  push:
    branches: [inventory-mvp]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Android
        run: bash tool/bootstrap_android.sh

      - name: Enable Muno v2 interface
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          marker = "import 'services/excel_service.dart';"
          additions = "\nimport 'premium_dashboard.dart';\nimport 'app_v2.dart';"
          if "import 'app_v2.dart';" not in s:
              s = s.replace(marker, marker + additions)
          s = s.replace('DashboardPage(user: widget.user),', 'PremiumDashboardPage(user: widget.user),', 1)
          s = s.replace('InventoriesPage(user: widget.user),', 'InventoriesV2Page(user: widget.user),', 1)
          # Keep original ProductsPage so Excel import and the full product form remain available.
          s = s.replace('WarehousesPage(user: widget.user),', 'WarehousesV2Page(user: widget.user),', 1)
          p.write_text(s)

          # Enrich the compact inventory result screen with monetary variance.
          p = Path('lib/app_v2.dart')
          s = p.read_text()
          old = "Text('Fərq ${diff>0?'+':''}${_n(diff)}',style:TextStyle(fontSize:10,color:diff<0?Colors.red:diff>0?Colors.green:Colors.black45))"
          new = "Text('Fərq ${diff>0?'+':''}${_n(diff)} · ${(l.differenceAmount??0)>0?'+':''}${_n(l.differenceAmount??0)} ₼',textAlign:TextAlign.right,style:TextStyle(fontSize:9,fontWeight:FontWeight.w700,color:diff<0?Colors.red:diff>0?Colors.green:Colors.black45))"
          s = s.replace(old, new)
          old2 = "final q=search.text.trim().toLowerCase(); final visible=lines.where((e)=>q.isEmpty||e.productName.toLowerCase().contains(q)).toList();"
          new2 = "final q=search.text.trim().toLowerCase(); final visible=lines.where((e)=>q.isEmpty||e.productName.toLowerCase().contains(q)).toList(); final shortage=lines.fold<double>(0,(a,e)=>a+((e.differenceAmount??0)<0?-(e.differenceAmount??0):0)); final surplus=lines.fold<double>(0,(a,e)=>a+((e.differenceAmount??0)>0?(e.differenceAmount??0):0)); final net=surplus-shortage;"
          s = s.replace(old2, new2)
          old3 = "return Scaffold(resizeToAvoidBottomInset:true,backgroundColor:_bg,appBar:AppBar(backgroundColor:_navy,foregroundColor:Colors.white,title:Text('${header!.warehouseName ?? ''} · ${header!.inventoryDate}',style:const TextStyle(fontSize:16,fontWeight:FontWeight.w700))),body:Column(children:["
          new3 = "return Scaffold(resizeToAvoidBottomInset:true,backgroundColor:_bg,appBar:AppBar(backgroundColor:_navy,foregroundColor:Colors.white,title:Text('${header!.warehouseName ?? ''} · ${header!.inventoryDate}',style:const TextStyle(fontSize:16,fontWeight:FontWeight.w700))),body:Column(children:[if(header!.isClosed)Container(margin:const EdgeInsets.fromLTRB(10,10,10,0),padding:const EdgeInsets.all(10),decoration:BoxDecoration(color:Colors.white,borderRadius:BorderRadius.circular(10)),child:Row(children:[Expanded(child:Text('Əskik: ${_n(shortage)} ₼',style:const TextStyle(fontSize:11,fontWeight:FontWeight.w800,color:Colors.red))),Expanded(child:Text('Artıq: ${_n(surplus)} ₼',textAlign:TextAlign.center,style:const TextStyle(fontSize:11,fontWeight:FontWeight.w800,color:Colors.green))),Expanded(child:Text('Xalis: ${net>0?'+':''}${_n(net)} ₼',textAlign:TextAlign.right,style:const TextStyle(fontSize:11,fontWeight:FontWeight.w900,color:_navy)))])),"
          s = s.replace(old3, new3)
          p.write_text(s)

          # Add inventory monetary difference KPIs to premium dashboard.
          p = Path('lib/premium_dashboard.dart')
          s = p.read_text()
          old = "final pending = await db.pendingSyncCount();\n    return _DashboardData(stats, inventories.take(5).toList(), warehouses, grandTotal, totalQty, pending);"
          new = """final raw = await db.database;
    final invWhere = companyId == null ? '' : 'AND i.company_id = ?';
    final invArgs = companyId == null ? <Object?>[] : <Object?>[companyId];
    final varianceRows = await raw.rawQuery('''SELECT COALESCE(SUM(CASE WHEN il.difference_amount < 0 THEN -il.difference_amount ELSE 0 END),0) shortage, COALESCE(SUM(CASE WHEN il.difference_amount > 0 THEN il.difference_amount ELSE 0 END),0) surplus FROM inventory_lines il JOIN inventories i ON i.id=il.inventory_id WHERE i.status='closed' $invWhere''', invArgs);
    final shortage = (varianceRows.first['shortage'] as num?)?.toDouble() ?? 0;
    final surplus = (varianceRows.first['surplus'] as num?)?.toDouble() ?? 0;
    final pending = await db.pendingSyncCount();
    return _DashboardData(stats, inventories.take(5).toList(), warehouses, grandTotal, totalQty, pending, shortage, surplus);"""
          s = s.replace(old, new)
          old2 = "const SizedBox(height: 18),\n                const _Title('Anbarlar üzrə qalıq'),"
          new2 = """const SizedBox(height: 12),
                Row(children: [
                  Expanded(child: _VarianceCard(label: 'Əskik məbləğ', value: _money(d.shortage), icon: Icons.trending_down_rounded, negative: true)),
                  const SizedBox(width: 10),
                  Expanded(child: _VarianceCard(label: 'Artıq məbləğ', value: _money(d.surplus), icon: Icons.trending_up_rounded, negative: false)),
                ]),
                const SizedBox(height: 10),
                _VarianceCard(label: 'Xalis inventar fərqi', value: _money(d.surplus-d.shortage), icon: Icons.balance_rounded, negative: d.surplus-d.shortage < 0),
                const SizedBox(height: 18),
                const _Title('Anbarlar üzrə qalıq'),"""
          s = s.replace(old2, new2)
          old3 = "class _Title extends StatelessWidget { const _Title(this.text);"
          new3 = "class _VarianceCard extends StatelessWidget { const _VarianceCard({required this.label,required this.value,required this.icon,required this.negative}); final String label;final String value;final IconData icon;final bool negative; @override Widget build(BuildContext context)=>Container(padding:const EdgeInsets.all(14),decoration:BoxDecoration(color:Colors.white,borderRadius:BorderRadius.circular(18),border:Border.all(color:const Color(0xFFE7ECEE))),child:Row(children:[CircleAvatar(backgroundColor:negative?const Color(0xFFFFEEEE):const Color(0xFFEAF8F0),child:Icon(icon,color:negative?const Color(0xFFB42318):const Color(0xFF14804A))),const SizedBox(width:10),Expanded(child:Column(crossAxisAlignment:CrossAxisAlignment.start,children:[Text(label,style:const TextStyle(fontSize:11,color:Color(0xFF6B7B80),fontWeight:FontWeight.w700)),Text(value,style:const TextStyle(fontSize:16,fontWeight:FontWeight.w900,color:_navy))]))])); }\nclass _Title extends StatelessWidget { const _Title(this.text);"
          s = s.replace(old3, new3)
          old4 = "final DashboardStats stats; final List<InventoryHeader> recent; final List<_WarehouseTotal> warehouses; final double grandTotal; final double totalQty; final int pending; }"
          new4 = "final DashboardStats stats; final List<InventoryHeader> recent; final List<_WarehouseTotal> warehouses; final double grandTotal; final double totalQty; final int pending; final double shortage; final double surplus; }"
          s = s.replace(old4, new4)
          old5 = "const _DashboardData(this.stats, this.recent, this.warehouses, this.grandTotal, this.totalQty, this.pending);"
          new5 = "const _DashboardData(this.stats, this.recent, this.warehouses, this.grandTotal, this.totalQty, this.pending, this.shortage, this.surplus);"
          s = s.replace(old5, new5)
          p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muno-inventory-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
