name: Android APK

on:
  push:
    branches: [inventory-mvp]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Android
        run: bash tool/bootstrap_android.sh

      - name: Enable Muno v2 interface
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          marker = "import 'services/excel_service.dart';"
          additions = "\nimport 'premium_dashboard.dart';\nimport 'app_v2.dart';"
          if "import 'app_v2.dart';" not in s:
              s = s.replace(marker, marker + additions)
          s = s.replace('DashboardPage(user: widget.user),', 'PremiumDashboardPage(user: widget.user),', 1)
          s = s.replace('InventoriesPage(user: widget.user),', 'InventoriesV2Page(user: widget.user),', 1)
          s = s.replace('ProductsPage(user: widget.user),', 'ProductsV2Page(user: widget.user),', 1)
          s = s.replace('WarehousesPage(user: widget.user),', 'WarehousesV2Page(user: widget.user),', 1)
          p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muno-inventory-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
